version: 1.3.18
cache: true

# Definition of custom endpoints
endpoints:
  agents:
    maxCitations: 30
    maxCitationsPerFile: 5
    minRelevanceScore: 0.45
    capabilities: ["file_search", "tools", "artifacts"]

  custom:
    - name: "Deepseek"
      apiKey: "${DEEPSEEK_API_KEY}"
      baseURL: "https://api.deepseek.com/v1"
      models:
        default: ["deepseek-chat", "deepseek-coder", "deepseek-reasoner"]
        fetch: true
      titleConvo: true
      titleModel: "deepseek-chat"
      modelDisplayLabel: "Deepseek"

    - name: "Mistral"
      apiKey: "${MISTRAL_API_KEY}"
      baseURL: "https://api.mistral.ai/v1"
      models:
        default: ["mistral-tiny", "mistral-medium", "mistral-large-latest"]
        fetch: true
      titleConvo: true
      titleModel: "mistral-tiny"
      modelDisplayLabel: "Mistral"
      dropParams: ["stop", "user", "frequency_penalty", "presence_penalty"]

    - name: "groq"
      apiKey: "${GROQ_API_KEY}"
      baseURL: "https://api.groq.com/openai/v1/"
      models:
        default:
          - "openai/gpt-oss-120b"
          - "openai/gpt-oss-20b"
          - "qwen/qwen3.8-27b"
          - "allam-2-7b"
        fetch: false
      titleConvo: true
      titleModel: "openai/gpt-oss-20b"
      modelDisplayLabel: "groq"

rateLimits:
  fileUploads:
    userMax: 5
    userWindowInMinutes: 2

# memory settings
memory:
  disabled: true  # Set to true to completely disable memory
  personalize: true  # Gives users the ability to toggle memory on/off, true by default
  tokenLimit: 2000  # Maximum tokens for memory storage
  messageWindowSize: 5  # Number of recent messages to consider
  agent:
    provider: "openAI"
    model: "gpt-4"

